name: Build Windows application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Validate packaging configuration
        shell: pwsh
        run: python validate_spec.py

      - name: Build application
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm ITS.spec

      - name: Verify packaged application
        shell: pwsh
        run: |
          $appDirectory = Join-Path $PWD "dist\ITS 智能座舱测试系统"
          $executable = Join-Path $appDirectory "ITS 智能座舱测试系统.exe"

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Packaged executable was not found: $executable"
          }

          $file = Get-Item -LiteralPath $executable
          "Executable: $($file.FullName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Executable size: $([math]::Round($file.Length / 1MB, 2)) MB" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create downloadable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $archive = Join-Path $PWD "release\ITS-Windows-x64.zip"
          Compress-Archive -LiteralPath "dist\ITS 智能座舱测试系统" -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash |
            Out-File -FilePath "release\ITS-Windows-x64.zip.sha256" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ITS-Windows-x64-${{ github.run_number }}
          path: |
            release/ITS-Windows-x64.zip
            release/ITS-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

